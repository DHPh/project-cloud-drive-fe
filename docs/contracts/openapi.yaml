        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [item, breadcrumbs]
                properties:
                  item:
                    $ref: '#/components/schemas/FolderItem'
                  breadcrumbs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Breadcrumb'
