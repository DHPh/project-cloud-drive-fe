openapi: 3.0.3
info:
  title: Cloud Drive API
  version: 0.6.0
  description: >-
    Browser API for sign-in, folder management, upload, file editing, download, file and folder trash, and sharing.
    State-changing browser requests require the configured application Origin.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Session
  - name: Folders
  - name: Files
  - name: Trash
  - name: Sharing

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Session]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A session was created and the signed-in user is returned.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: The credentials are invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: The email or password is incorrect.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Session]
      summary: Read the current session user
      responses:
        '200':
          description: The signed-in user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      tags: [Session]
      summary: End the current session
      description: An expired or missing session is already signed out.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: The session is ended and the browser cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie using its original name and path.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    $ref: '#/components/schemas/Success'
                  data:
                    type: object
                    required: [signedOut]
                    properties:
                      signedOut:
                        type: boolean
                        enum: [true]
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders:
    post:
      operationId: createFolder
      tags: [Folders]
      summary: Create a folder
      description: Creates a folder under a parent owned by the current account or in the root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: The new folder.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolderMutationConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}:
    patch:
      operationId: updateFolder
      tags: [Folders]
      summary: Rename or move a folder
      description: >-
        Only the owner can update the folder. Omitted fields keep their current values.
        A null parentId moves it to the root. The folder cannot move into itself or a
        descendant. File and folder IDs, object data and file sharing grants are preserved.
        An unchanged name and parent return the existing folder.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
      responses:
        '200':
          description: The current folder after the update.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolderMutationConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/contents:
    get:
      operationId: listFolderContents
      tags: [Folders]
      summary: List direct children of a folder
      description: >-
        Use root for the signed-in user's root. Pagination applies to the combined file
        and folder list after filtering. Results sort by kind (folders first), then
        by display name without case sensitivity, then by ID in ascending order.
        A page past the last result returns an empty items array.
        Files in Trash are excluded from listing and search.
        With type=folders, only folders count toward total or pagination.
        A recipient can list a folder with an active share on it or an ancestor.
        Recipient breadcrumbs are limited to folders that account may view.
      parameters:
        - $ref: '#/components/parameters/FolderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          description: Return all eligible items or only folders before pagination.
          schema:
            type: string
            enum: [all, folders]
            default: all
        - name: q
          in: query
          description: >-
            Case-insensitive display name substring for direct children in this folder.
            Leading and trailing whitespace is ignored. An empty value applies no filter.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: The requested page of visible files and folders.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderContentsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a file
      description: The uploaded file is private by default.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  description: Omit this field or pass root to upload to the user's root.
                  allOf:
                    - $ref: '#/components/schemas/FolderReference'
      responses:
        '201':
          description: The file is stored and available to the current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QuotaExceeded'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /files/{fileId}:
    get:
      operationId: getFile
      tags: [Files, Sharing]
      summary: Read file information
      description: The owner or a recipient with an unexpired direct or inherited grant can read a ready, active file.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Information for a file visible to the signed-in account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateFile
      tags: [Files]
      summary: Edit file metadata or move it to a folder
      description: >-
        At least one field is required. Omitted fields keep their current values.
        Set description to null or tags to an empty array to clear them.
        An owner can change folderId to an owned folder or null for their root.
        Moving keeps file ID, object, quota and direct grants. Inherited access follows the new location.
        Files in Trash return 404.
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileRequest'
      responses:
        '200':
          description: The updated file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/download:
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download the file as an attachment
      description: The owner or a recipient with an unexpired direct or inherited grant can download the active file. Files in Trash return 404.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File bytes served as an attachment.
          headers:
            Content-Disposition:
              description: >-
                Attachment disposition with the percent-encoded UTF-8 display name in filename*.
                filename is included when the same display name fits in the ASCII parameter.
              schema:
                type: string
              example: "attachment; filename*=UTF-8''b%C3%A1o-c%C3%A1o.pdf"
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /files/{fileId}/trash:
    post:
      operationId: trashFile
      tags: [Trash]
      summary: Move a file to Trash
      description: >-
        The owner can move a ready file to Trash. Repeating the request leaves the
        original trashedAt unchanged. File ID, folder, object, and storage usage are preserved.
        Moving the file to Trash revokes all sharing grants.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/FileTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/restore:
    post:
      operationId: restoreFile
      tags: [Trash]
      summary: Restore a file to a private location
      description: >-
        The owner restores a trashed file to its original active, private location, or to the owner's root
        if that location is unavailable or shared. If an active file at the destination already has
        the exact name, the restored file receives the first available ` - khôi phục` suffix (` - khôi phục 2`,
        ` - khôi phục 3`, and so on), inserted before the final extension if present.
        Repeating the request on an active file returns the same active state.
        File ID, object and storage usage are preserved. The response includes the resulting folderId and originalName.
        Restoring a file does not restore sharing grants.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/FileTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/trash:
    post:
      operationId: trashFolder
      tags: [Trash]
      summary: Move a folder and its active descendants to Trash
      description: >-
        The owner moves an active folder and its active descendants to Trash as a single item.
        This atomically revokes direct file and folder grants for the affected items. Independently
        trashed items stay separate. Repeating the request on the batch root preserves its timestamp.
      parameters:
        - $ref: '#/components/parameters/FolderUuid'
      responses:
        '200':
          $ref: '#/components/responses/FolderTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/restore:
    post:
      operationId: restoreFolder
      tags: [Trash]
      summary: Restore a folder's Trash batch to a private location
      description: >-
        The owner restores the folder and items from the same Trash batch. An active, private former parent
        is preferred, otherwise the owner's root is used. An exact folder name conflict at the destination
        is resolved with the first available ` - khôi phục` suffix (` - khôi phục 2`, ` - khôi phục 3`, and so on).
        Repeating a restore on an active folder returns its current state. IDs, objects and quota are preserved.
        Independently trashed descendants remain in Trash and revoked grants are not restored.
      parameters:
        - $ref: '#/components/parameters/FolderUuid'
      responses:
        '200':
          $ref: '#/components/responses/FolderTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /trash:
    get:
      operationId: listTrash
      tags: [Trash]
      summary: List Trash items for the signed-in user
      description: >-
        By default, returns independently trashed files for existing clients. Set includeFolders to true
        to paginate independently trashed files and folder batch roots in one ordered list. Items are ordered
        by newest trashedAt, then by ID in ascending order. A page past the last result has an empty items array.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: includeFolders
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of independently trashed items in the signed-in user's Trash.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /files/{fileId}/shares:
    get:
      operationId: listFileShares
      tags: [Sharing]
      summary: List sharing grants for a file owned by the signed-in account
      description: Includes expired grants. Sorts by latest grantedAt, then recipient ID.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sharing grants.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSharesResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: grantFileShare
      tags: [Sharing]
      summary: Grant or update read and download access for an existing account
      description: >-
        Only the file owner may grant access to an active, ready file.
        Omitting expiresAt or passing null defaults a new grant to one calendar
        month from the time of granting, in Vietnam time. A repeated request with
        a blank expiry leaves an active grant's expiry unchanged. A future date-time
        can update an active grant. An expired grant can be granted again.
        An unknown recipient email returns 404 with code RECIPIENT_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantFileShareRequest'
      responses:
        '200':
          description: The current grant with its effective expiration.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileShareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/shares/{recipientId}:
    delete:
      operationId: revokeFileShare
      tags: [Sharing]
      summary: Revoke the recipient's grant
      description: Only the file owner may revoke. Repeating revocation returns the same result.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The recipient can no longer access the file through this grant.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeFileShareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /shared-with-me:
    get:
      operationId: listSharedFiles
      tags: [Sharing]
      summary: List files shared with the signed-in account
      description: >-
        Includes ready, active files with unexpired direct file grants. Sorts by latest sharedAt,
        then file ID. A page past the last result returns an empty items array.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of files shared with the current account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedFilesResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /folders/{folderId}/shares:
    get:
      operationId: listFolderShares
      tags: [Folders, Sharing]
      summary: List sharing grants of a folder owned by the signed-in account
      description: Includes expired grants. Sorts by latest grantedAt, then recipient ID.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of direct sharing grants for the folder.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSharesResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: grantFolderShare
      tags: [Folders, Sharing]
      summary: Grant or update read and download access to a folder and its descendants
      description: >-
        The folder owner grants access to an existing account by email. A blank expiry
        on a new grant defaults to one calendar month in Vietnam time. A repeated request
        with a blank expiry preserves an active grant's expiration. An unknown recipient
        email returns 404 with code RECIPIENT_NOT_FOUND.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantFileShareRequest'
      responses:
        '200':
          description: The current folder grant and its effective expiration.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileShareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/shares/{recipientId}:
    delete:
      operationId: revokeFolderShare
      tags: [Folders, Sharing]
      summary: Revoke a recipient's direct grant on the folder
      description: >-
        Only the folder owner may revoke. This removes the access inherited from this grant.
        Repeating revocation returns the same result.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The grant has been revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeFileShareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /shared-folders:
    get:
      operationId: listSharedFolders
      tags: [Folders, Sharing]
      summary: List folders shared directly with the signed-in account
      description: >-
        Lists active, unexpired direct folder grants. Descendants are opened by
        browsing the corresponding folder. A page past the last result is empty.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of folders directly shared with the current account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedFoldersResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cloud_drive_session
      description: Server-issued opaque session value for the same-origin browser.

  parameters:
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FolderReference'
    FolderUuid:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    SessionCookie:
      description: Sets the cloud_drive_session cookie with HttpOnly and SameSite=Lax. HTTPS deployments also use Secure.
      schema:
        type: string
      example: 'cloud_drive_session=example; Path=/; HttpOnly; Secure; SameSite=Lax'
    PrivateCache:
      description: The response is private and must not be stored in caches.
      schema:
        type: string
        enum: ['private, no-store']

  responses:
    FolderMutationConflict:
      description: >-
        FOLDER_NAME_CONFLICT indicates an exact duplicate name in the destination.
        INVALID_FOLDER_MOVE indicates a move into the source folder or a descendant.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FileTrashState:
      description: Current Trash state of the file after the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileTrashStateResponse'
    FolderTrashState:
      description: Current Trash state of the folder after the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FolderTrashStateResponse'
    InvalidRequest:
      description: A path, query, or body field is invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_REQUEST
              message: The request contains invalid values.
    SessionRequired:
      description: The session is missing, expired, or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SESSION_REQUIRED
              message: Sign in to continue.
    Forbidden:
      description: The request origin is disallowed or the visible resource cannot be changed by this user.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to make this change.
    NotFound:
      description: The file or folder is absent or outside the user's access scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: The requested item was not found.
    QuotaExceeded:
      description: The upload would exceed the user's storage quota.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: STORAGE_QUOTA_EXCEEDED
              message: This upload exceeds your storage quota.
    FileTooLarge:
      description: The upload exceeds the server's per-file size limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FILE_TOO_LARGE
              message: The file exceeds the upload size limit.
    UnsupportedMediaType:
      description: The upload request or file media type is unsupported.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: This upload media type is not supported.
    RateLimited:
      description: Requests to this operation exceeded the current limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
        Retry-After:
          description: Seconds until the operation can be retried.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many requests. Try again later.
    InternalError:
      description: An unexpected server error prevented completion.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
    StorageUnavailable:
      description: Object storage is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: STORAGE_UNAVAILABLE
              message: File storage is temporarily unavailable.

  schemas:
    Success:
      type: boolean
      enum: [true]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable identifier for client handling.
            message:
              type: string
              description: Human-readable description of the error.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          $ref: '#/components/schemas/User'
    FolderReference:
      type: string
      pattern: '^(root|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$'
      description: A folder UUID or the literal root.
    FolderSummary:
      type: object
      required: [kind, id, name, parentId, createdAt, updatedAt]
      properties:
        kind:
          type: string
          enum: [folder]
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null for a folder directly under the user's root.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FolderName:
      type: string
      minLength: 1
      maxLength: 255
      description: >-
        Trimmed display name. Exact case-sensitive active sibling names must be
        unique for the same owner, including in the root.
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Parent folder ID. Null or omitted creates in the root.
    UpdateFolderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Parent folder ID. Null moves the folder to the root.
    FolderResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          $ref: '#/components/schemas/FolderSummary'
    FileSummary:
      type: object
      required: [kind, id, originalName, folderId, mimeType, size, description, tags, createdAt, updatedAt]
      properties:
        kind:
          type: string
          enum: [file]
        id:
          type: string
          format: uuid
        originalName:
          $ref: '#/components/schemas/FileName'
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Null for a file directly under the user's root.
        mimeType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
          description: File size in bytes.
        description:
          $ref: '#/components/schemas/FileDescription'
        tags:
          $ref: '#/components/schemas/FileTags'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FileName:
      type: string
      minLength: 1
      maxLength: 255
      description: The file's user-visible name, including its extension if present.
    FileDescription:
      type: string
      nullable: true
      maxLength: 2000
    FileTags:
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 64
    FolderItem:
      oneOf:
        - $ref: '#/components/schemas/FolderSummary'
        - $ref: '#/components/schemas/FileSummary'
      discriminator:
        propertyName: kind
        mapping:
          folder: '#/components/schemas/FolderSummary'
          file: '#/components/schemas/FileSummary'
    Breadcrumb:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          description: The requested one-based page number.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The effective page size applied to the query.
        total:
          type: integer
          minimum: 0
          description: Total visible items matching the resource filters.
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages, with zero pages for an empty result.
    FolderContentsResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [access, folder, breadcrumbs, items]
          properties:
            access:
              type: string
              enum: [owner, viewer]
              description: Current account access for this folder view.
            folder:
              description: Current folder details or null for root.
              oneOf:
                - $ref: '#/components/schemas/FolderSummary'
                - type: object
                  nullable: true
                  enum: [null]
            breadcrumbs:
              type: array
              description: >-
                Visible ancestors in root-to-leaf order, followed by the current
                folder. The user's root is implicit and returns an empty array.
              items:
                $ref: '#/components/schemas/Breadcrumb'
            items:
              type: array
              items:
                $ref: '#/components/schemas/FolderItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    TrashedFileItem:
      allOf:
        - $ref: '#/components/schemas/FileSummary'
        - type: object
          required: [trashedAt]
          properties:
            trashedAt:
              type: string
              format: date-time
    TrashedFolderItem:
      allOf:
        - $ref: '#/components/schemas/FolderSummary'
        - type: object
          required: [trashedAt]
          properties:
            trashedAt:
              type: string
              format: date-time
    TrashItem:
      oneOf:
        - $ref: '#/components/schemas/TrashedFileItem'
        - $ref: '#/components/schemas/TrashedFolderItem'
      discriminator:
        propertyName: kind
        mapping:
          file: '#/components/schemas/TrashedFileItem'
          folder: '#/components/schemas/TrashedFolderItem'
    TrashListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrashItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    FileTrashStateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [id, trashedAt, folderId, originalName]
          properties:
            id:
              type: string
              format: uuid
            trashedAt:
              type: string
              format: date-time
              nullable: true
              description: Time moved to Trash, or null when active.
            folderId:
              type: string
              format: uuid
              nullable: true
              description: File's resulting parent. Null means the owner's root.
            originalName:
              $ref: '#/components/schemas/FileName'
    FolderTrashStateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [id, trashedAt, parentId, name]
          properties:
            id:
              type: string
              format: uuid
            trashedAt:
              type: string
              format: date-time
              nullable: true
              description: Time moved to Trash, or null when active.
            parentId:
              type: string
              format: uuid
              nullable: true
              description: Folder's resulting parent. Null means the owner's root.
            name:
              $ref: '#/components/schemas/FolderName'
    UpdateFileRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        originalName:
          $ref: '#/components/schemas/FileName'
        description:
          $ref: '#/components/schemas/FileDescription'
        tags:
          $ref: '#/components/schemas/FileTags'
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Move the file to an owned folder. Null means the owner's root.
    GrantFileShareRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Future expiration with a time zone. An omitted or null value applies the default policy.
    ShareGrant:
      type: object
      required: [recipientId, recipientEmail, recipientName, grantedAt, expiresAt, isActive]
      properties:
        recipientId:
          type: string
          format: uuid
        recipientEmail:
          type: string
          format: email
        recipientName:
          type: string
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isActive:
          type: boolean
          description: Whether the grant is valid at the time the response was generated.
    FileShareResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          $ref: '#/components/schemas/ShareGrant'
    FileSharesResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ShareGrant'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SharedFile:
      allOf:
        - $ref: '#/components/schemas/FileSummary'
        - type: object
          required: [ownerName, sharedAt, expiresAt]
          properties:
            ownerName:
              type: string
            sharedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
    SharedFilesResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SharedFile'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SharedFolder:
      type: object
      required: [kind, id, name, ownerName, sharedAt, expiresAt]
      properties:
        kind:
          type: string
          enum: [folder]
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerName:
          type: string
        sharedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    SharedFoldersResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SharedFolder'
        pagination:
          $ref: '#/components/schemas/Pagination'
    RevokeFileShareResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          type: object
          required: [revoked]
          properties:
            revoked:
              type: boolean
              enum: [true]
    FileResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          $ref: '#/components/schemas/FileSummary'
