openapi: 3.0.3
info:
  title: Cloud Drive API
  version: 0.13.0
  description: >-
    Browser API for sign-in, folder management, upload, file editing, download, file and folder trash, and sharing.
    State-changing browser requests require the configured application Origin.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Session
  - name: Folders
  - name: Files
  - name: Trash
  - name: Sharing
  - name: Boards
  - name: Account
  - name: Admin

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Session]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A session was created and the signed-in user is returned.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: The credentials are invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: The email or password is incorrect.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Session]
      summary: Read the current session user
      responses:
        '200':
          description: The signed-in user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      tags: [Session]
      summary: End the current session
      description: An expired or missing session is already signed out.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: The session is ended and the browser cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie using its original name and path.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    $ref: '#/components/schemas/Success'
                  data:
                    type: object
                    required: [signedOut]
                    properties:
                      signedOut:
                        type: boolean
                        enum: [true]
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/accept-invite:
    post:
      operationId: acceptAccountInvite
      tags: [Account]
      summary: Set a password and create the invited account
      description: Consumes the one-time link and creates a user. The user signs in separately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '201':
          description: The new account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountLinkNotFound' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '410': { $ref: '#/components/responses/AccountLinkExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/reset-password:
    post:
      operationId: resetAccountPassword
      tags: [Account]
      summary: Set a password from a one-time admin link
      description: Consumes the link and revokes all sessions on the target account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/PasswordChanged' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountLinkNotFound' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '410': { $ref: '#/components/responses/AccountLinkExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /account:
    get:
      operationId: getAccount
      tags: [Account]
      summary: Read the account profile and storage usage
      responses:
        '200': { $ref: '#/components/responses/AccountProfile' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateAccount
      tags: [Account]
      summary: Update the signed-in account's display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200': { $ref: '#/components/responses/AccountProfile' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /account/password:
    post:
      operationId: changeAccountPassword
      tags: [Account]
      summary: Change the signed-in account's password and revoke all its sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: The password changed. The browser session cookie is cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChangedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403':
          description: The request origin is disallowed or the current password is incorrect (`CURRENT_PASSWORD_INVALID`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/invites:
    get:
      operationId: listAccountInvites
      tags: [Admin]
      summary: List invitations, most recently created first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [all, active, expired, used, revoked], default: all }
      responses:
        '200':
          description: A page of invitation statuses without tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountInviteListResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createAccountInvite
      tags: [Admin]
      summary: Issue a 24-hour invite to the given email address
      description: The token is returned only on issuance. Issuing another invite revokes the prior active invite for that address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: The invite and its one-time token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountInviteIssuedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/invites/{inviteId}:
    delete:
      operationId: revokeAccountInvite
      tags: [Admin]
      summary: Revoke an outstanding invitation
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The invite is no longer valid. Repeated revocation returns the same result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountLinkNotFound' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin]
      summary: List account status, role and storage usage in email order
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Case-insensitive literal substring of name or email.
          schema: { type: string, maxLength: 255, default: '' }
      responses:
        '200':
          description: A page of user accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserListResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      tags: [Admin]
      summary: Change an account's role, status or quota
      description: Omitted fields stay unchanged. The last active administrator must remain active and cannot be demoted.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUserRequest' }
      responses:
        '200':
          description: The current account after the update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/users/{userId}/reset-password:
    post:
      operationId: issueAdminPasswordReset
      tags: [Admin]
      summary: Issue a 30-minute reset link for the account
      description: Issuance replaces any prior active reset link. The token is returned only on issuance.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '201':
          description: The one-time token and its expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetIssuedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [Admin]
      summary: List recorded account administration actions, most recent first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of successful administrative changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditListResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /drive/search:
    get:
      operationId: searchDrive
      tags: [Folders, Files]
      summary: Search the signed-in account's own Drive
      description: Searches active folders and uploaded files by name, with optional descriptions and file tags. Matching is case-insensitive and literal.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, maxLength: 255, default: '' }
        - name: includeMetadata
          in: query
          schema: { type: boolean, default: false }
        - name: type
          in: query
          schema: { type: string, enum: [all, files, folders], default: all }
        - name: sort
          in: query
          description: Sort by case-insensitive name or newest creation time, then by ID and kind.
          schema: { type: string, enum: [name, newest], default: name }
      responses:
        '200':
          description: A page of matching items with breadcrumbs to their parent. The root is omitted from breadcrumbs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveSearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /drive/timeline:
    get:
      operationId: listDriveTimeline
      tags: [Files]
      summary: List the signed-in account's uploaded files by date
      description: >-
        Returns active files owned by the account, newest upload first with an ID tie-break. Date filters
        include both selected dates in Asia/Ho_Chi_Minh. Editing metadata or moving a file preserves its upload date.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: type
          in: query
          schema: { type: string, enum: [all, image, video, audio, pdf, document, other], default: all }
      responses:
        '200':
          description: A page of files with breadcrumbs to their parent. The root is omitted from breadcrumbs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveTimelineResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders:
    post:
      operationId: createFolder
      tags: [Folders]
      summary: Create a folder
      description: Creates a folder with an optional plain-text description under an owned parent or in the root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: The new folder.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolderMutationConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}:
    patch:
      operationId: updateFolder
      tags: [Folders]
      summary: Edit folder metadata or move a folder
      description: >-
        The owner can update name, description and parentId. A recipient with effective editor access
        can update the description alone. Omitted fields keep their current values.
        Set description to null to clear it.
        A null parentId moves it to the root. The folder cannot move into itself or a
        descendant. File and folder IDs, object data and file sharing grants are preserved.
        If all fields are unchanged, returns the existing folder.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
      responses:
        '200':
          description: The current folder after the update.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FolderMutationConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/contents:
    get:
      operationId: listFolderContents
      tags: [Folders]
      summary: List direct children of a folder
      description: >-
        Use root for the signed-in user's root. Pagination applies to the combined file
        and folder list after filtering. Results sort by kind (folders first), then
        by display name without case sensitivity, then by ID in ascending order.
        A page past the last result returns an empty items array.
        Files in Trash are excluded from listing and search.
        With type=folders, only folders count toward total or pagination.
        A recipient can list a folder with an active share on it or an ancestor.
        The highest active grant determines viewer or editor access.
        Recipient breadcrumbs are limited to folders that account may view.
      parameters:
        - $ref: '#/components/parameters/FolderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          description: Return all eligible items or only folders before pagination.
          schema:
            type: string
            enum: [all, folders]
            default: all
        - name: q
          in: query
          description: >-
            Case-insensitive display name substring for direct children in this folder.
            Leading and trailing whitespace is ignored. An empty value applies no filter.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: The requested page of visible files and folders.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderContentsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/download:
    get:
      operationId: downloadFolderArchive
      tags: [Folders]
      summary: Download an authorized folder tree as ZIP
      description: Includes active descendants, ready files and empty folders. Stops the download if an object becomes unavailable or permission is lost while streaming.
      parameters:
        - $ref: '#/components/parameters/FolderUuid'
      responses:
        '200':
          description: ZIP archive with safe Unicode archive paths.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: ARCHIVE_TOO_LARGE. Choose a smaller folder (up to 500 files, 500 folders and 100 MiB of file content).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /files:
    post:
      operationId: uploadFile
      tags: [Files]
      summary: Upload a file
      description: >-
        Uploads into the account's root or an active folder it owns or can edit. A file uploaded by an
        editor belongs to the folder owner and uses that owner's quota. Upload completion checks current access again.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  description: Omit this field or pass root to upload to the user's root.
                  allOf:
                    - $ref: '#/components/schemas/FolderReference'
      responses:
        '201':
          description: The file is stored and available to the current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QuotaExceeded'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /files/{fileId}:
    get:
      operationId: getFile
      tags: [Files, Sharing]
      summary: Read file information
      description: >-
        The owner or a recipient with an unexpired direct or inherited grant can read a ready, active file.
        The response identifies owner access or the highest active viewer or editor grant.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Details and access role for a file visible to the signed-in account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetailResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateFile
      tags: [Files]
      summary: Edit file metadata or move it to a folder
      description: >-
        At least one field is required. Omitted fields keep their current values.
        Set description to null or tags to an empty array to clear them.
        An editor can change originalName, description and tags.
        An owner can change folderId to an owned folder or null for their root.
        Moving keeps file ID, object, quota and direct grants. Inherited access follows the new location.
        Files in Trash return 404.
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileRequest'
      responses:
        '200':
          description: The updated file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/download:
    get:
      operationId: downloadFile
      tags: [Files]
      summary: Download the file as an attachment
      description: The owner or a recipient with an unexpired direct or inherited grant can download the active file. Files in Trash return 404.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File bytes served as an attachment.
          headers:
            Content-Disposition:
              description: >-
                Attachment disposition with the percent-encoded UTF-8 display name in filename*.
                filename is included when the same display name fits in the ASCII parameter.
              schema:
                type: string
              example: "attachment; filename*=UTF-8''b%C3%A1o-c%C3%A1o.pdf"
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /files/{fileId}/preview:
    get:
      operationId: previewFile
      tags: [Files]
      summary: Read supported content for a private preview
      description: Checks the current file read permission. Returns raster images, PDF or UTF-8 plain text only. Responses are private and use a sandbox content-security policy. Limits are 512 KiB for text and 10 MiB otherwise.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Validated preview bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: PREVIEW_TOO_LARGE. Download remains available if permitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: PREVIEW_UNSUPPORTED. Download remains available if permitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /files/{fileId}/trash:
    post:
      operationId: trashFile
      tags: [Trash]
      summary: Move a file to Trash
      description: >-
        The owner can move a ready file to Trash. Repeating the request leaves the
        original trashedAt unchanged. File ID, folder, object, and storage usage are preserved.
        Moving the file to Trash revokes all sharing grants.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/FileTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/restore:
    post:
      operationId: restoreFile
      tags: [Trash]
      summary: Restore a file to a private location
      description: >-
        The owner restores a trashed file to its original active, private location, or to the owner's root
        if that location is unavailable or shared. If an active file at the destination already has
        the exact name, the restored file receives the first available ` - khôi phục` suffix (` - khôi phục 2`,
        ` - khôi phục 3`, and so on), inserted before the final extension if present.
        Repeating the request on an active file returns the same active state.
        File ID, object and storage usage are preserved. The response includes the resulting folderId and originalName.
        Restoring a file does not restore sharing grants.
        Clients can send the Trash event ID to protect the action against a later Trash event.
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashEventRequest'
      responses:
        '200':
          $ref: '#/components/responses/FileTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrashConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/trash:
    post:
      operationId: trashFolder
      tags: [Trash]
      summary: Move a folder and its active descendants to Trash
      description: >-
        The owner moves an active folder and its active descendants to Trash as a single item.
        This atomically revokes direct file and folder grants for the affected items. Independently
        trashed items stay separate. Repeating the request on the batch root preserves its timestamp.
      parameters:
        - $ref: '#/components/parameters/FolderUuid'
      responses:
        '200':
          $ref: '#/components/responses/FolderTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /folders/{folderId}/restore:
    post:
      operationId: restoreFolder
      tags: [Trash]
      summary: Restore a folder's Trash batch to a private location
      description: >-
        The owner restores the folder and items from the same Trash batch. An active, private former parent
        is preferred, otherwise the owner's root is used. An exact folder name conflict at the destination
        is resolved with the first available ` - khôi phục` suffix (` - khôi phục 2`, ` - khôi phục 3`, and so on).
        Repeating a restore on an active folder returns its current state. IDs, objects and quota are preserved.
        Independently trashed descendants remain in Trash and revoked grants are not restored.
        Clients can send the Trash event ID to protect the action against a later Trash event.
      parameters:
        - $ref: '#/components/parameters/FolderUuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashEventRequest'
      responses:
        '200':
          $ref: '#/components/responses/FolderTrashState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrashConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /trash:
    get:
      operationId: listTrash
      tags: [Trash]
      summary: List Trash items for the signed-in user
      description: >-
        By default, returns independently trashed files for existing clients. Set includeFolders to true
        to paginate independently trashed files and folder batch roots in one ordered list. Items are ordered
        by newest trashedAt, then by ID in ascending order. A page past the last result has an empty items array.
        The summary covers the whole account regardless of paging or folder inclusion.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: includeFolders
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of independently trashed items in the signed-in user's Trash.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'

  /trash/{kind}/{itemId}/purge:
    post:
      operationId: purgeTrashItem
      tags: [Trash]
      summary: Accept one Trash event for permanent deletion
      description: >-
        Only the owner may submit a Trash event. Accepting it ends the ability to restore it.
        For a folder, only the members of the selected Trash event are deleted. Repeat submissions of an
        accepted event return the same count. An event that was restored or replaced is stale.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [file, folder]
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashEventRequest'
      responses:
        '202':
          $ref: '#/components/responses/TrashPurgeAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrashConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /trash/empty:
    post:
      operationId: emptyTrash
      tags: [Trash]
      summary: Accept the current recoverable Trash entries for permanent deletion
      description: >-
        The backend captures entries at acceptance, excluding entries already being processed.
        Reusing the same owner-scoped requestId returns its original count and does not include later entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyTrashRequest'
      responses:
        '202':
          $ref: '#/components/responses/TrashPurgeAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /shared-by-me:
    get:
      operationId: listOutgoingShares
      tags: [Sharing]
      summary: List direct grants issued by the current account
      description: Returns grants on active resources owned by the account. Includes expired grants unless filtered. Multiple recipient grants for an item have separate rows. Sorts by newest grantedAt, kind, resource ID and recipient ID.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { type: string, enum: [all, files, folders], default: all }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, expired], default: all }
      responses:
        '200':
          description: A page of outgoing grants.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutgoingSharesResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/shares:
    get:
      operationId: listFileShares
      tags: [Sharing]
      summary: List sharing grants for a file owned by the signed-in account
      description: Includes expired grants. Sorts by latest grantedAt, then recipient ID.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sharing grants.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSharesResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: grantFileShare
      tags: [Sharing]
      summary: Grant or update read and download access for an existing account
      description: >-
        Only the file owner may grant access to an active, ready file.
        Omitting expiresAt or passing null defaults a new grant to one calendar
        month from the time of granting, in Vietnam time. A repeated request with
        a blank expiry leaves an active grant's expiry unchanged. A future date-time
        can update an active grant. An expired grant can be granted again.
        An unknown recipient email returns 404 with code RECIPIENT_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantFileShareRequest'
      responses:
        '200':
          description: The current grant with its effective expiration.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileShareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{fileId}/shares/{recipientId}:
    delete:
      operationId: revokeFileShare
      tags: [Sharing]
      summary: Revoke the recipient's grant
      description: Only the file owner may revoke. Repeating revocation returns the same result.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The recipient can no longer access the file through this grant.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeFileShareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /shared-with-me:
    get:
      operationId: listSharedFiles
      tags: [Sharing]
