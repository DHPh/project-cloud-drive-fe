        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cloud_drive_session
      description: Server-issued opaque session value for the same-origin browser.

  parameters:
    AdminUserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FolderReference'
    FolderUuid:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    SessionCookie:
      description: Sets the cloud_drive_session cookie with HttpOnly and SameSite=Lax. HTTPS deployments also use Secure.
      schema:
        type: string
      example: 'cloud_drive_session=example; Path=/; HttpOnly; Secure; SameSite=Lax'
    PrivateCache:
      description: The response is private and must not be stored in caches.
      schema:
        type: string
        enum: ['private, no-store']

  responses:
    AccountProfile:
      description: The current profile and storage use.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountProfileResponse' }
    PasswordChanged:
      description: The password changed and the account's sessions were invalidated.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PasswordChangedResponse' }
    AccountConflict:
      description: >-
        The link was already used or revoked (ACCOUNT_LINK_USED, ACCOUNT_LINK_REVOKED), the email is already registered
        (ACCOUNT_EMAIL_CONFLICT), the quota is below storage already used (QUOTA_BELOW_USAGE), or this is the last active
        administrator (LAST_ACTIVE_ADMIN).
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountLinkNotFound:
      description: The link does not exist or is for a different operation (ACCOUNT_LINK_NOT_FOUND).
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountLinkExpired:
      description: The link has expired (ACCOUNT_LINK_EXPIRED).
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FolderMutationConflict:
      description: >-
        FOLDER_NAME_CONFLICT indicates an exact duplicate name in the destination.
        INVALID_FOLDER_MOVE indicates a move into the source folder or a descendant.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FileTrashState:
      description: Current Trash state of the file after the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileTrashStateResponse'
    FolderTrashState:
      description: Current Trash state of the folder after the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FolderTrashStateResponse'
    TrashConflict:
      description: >-
        DELETE_IN_PROGRESS indicates the Trash event has already been accepted for deletion and cannot be restored.
        STALE_TRASH_EVENT indicates a Trash event no longer matches the selected item.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TrashPurgeAccepted:
      description: >-
        Accepted for asynchronous deletion. This response does not confirm object removal or quota release.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrashPurgeAcceptedResponse'
    InvalidRequest:
      description: A path, query, or body field is invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_REQUEST
              message: The request contains invalid values.
    SessionRequired:
      description: The session is missing, expired, or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SESSION_REQUIRED
              message: Sign in to continue.
    Forbidden:
      description: The request origin is disallowed or the visible resource cannot be changed by this user.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to make this change.
    NotFound:
      description: The file or folder is absent or outside the user's access scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: The requested item was not found.
    QuotaExceeded:
      description: The upload would exceed the user's storage quota.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: STORAGE_QUOTA_EXCEEDED
              message: This upload exceeds your storage quota.
    FileTooLarge:
      description: The upload exceeds the server's per-file size limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FILE_TOO_LARGE
              message: The file exceeds the upload size limit.
    UnsupportedMediaType:
      description: The upload request or file media type is unsupported.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: This upload media type is not supported.
    RateLimited:
      description: Requests to this operation exceeded the current limit.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
        Retry-After:
          description: Seconds until the operation can be retried.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many requests. Try again later.
    InternalError:
      description: An unexpected server error prevented completion.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
    StorageUnavailable:
      description: Object storage is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: STORAGE_UNAVAILABLE
              message: File storage is temporarily unavailable.

  schemas:
    Success:
      type: boolean
      enum: [true]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable identifier for client handling.
            message:
              type: string
              description: Human-readable description of the error.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/AccountRole'
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          $ref: '#/components/schemas/Success'
        data:
          $ref: '#/components/schemas/User'
    AccountRole:
      type: string
      enum: [user, admin]
    AccountName:
      type: string
      minLength: 1
      maxLength: 120
    AccountPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 1024
    AccountLinkToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    StorageBytes:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token, password, name]
      properties:
        token: { $ref: '#/components/schemas/AccountLinkToken' }
        password: { $ref: '#/components/schemas/AccountPassword' }
        name: { $ref: '#/components/schemas/AccountName' }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { $ref: '#/components/schemas/AccountLinkToken' }
        password: { $ref: '#/components/schemas/AccountPassword' }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, password]
      properties:
        currentPassword: { type: string, format: password, minLength: 1, maxLength: 1024 }
        password: { $ref: '#/components/schemas/AccountPassword' }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/AccountName' }
    AccountStorage:
      type: object
      required: [usedBytes, trashedBytes, quotaBytes]
      properties:
        usedBytes: { $ref: '#/components/schemas/StorageBytes' }
        trashedBytes: { $ref: '#/components/schemas/StorageBytes' }
        quotaBytes: { $ref: '#/components/schemas/StorageBytes' }
    AccountProfileResponse:
      type: object
      required: [success, data]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [user, storage]
          properties:
            user: { $ref: '#/components/schemas/User' }
            storage: { $ref: '#/components/schemas/AccountStorage' }
    PasswordChangedResponse:
      type: object
      required: [success, data]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [passwordChanged]
          properties:
            passwordChanged: { type: boolean, enum: [true] }
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AccountInvite:
      type: object
      required: [id, email, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active, expired, used, revoked] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AccountInviteListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AccountInvite' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    AccountInviteIssuedResponse:
      type: object
      required: [success, data]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [invite, token]
          properties:
            invite: { $ref: '#/components/schemas/AccountInvite' }
            token: { $ref: '#/components/schemas/AccountLinkToken' }
    RevokedResponse:
      type: object
      required: [success, data]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [revoked]
          properties:
            revoked: { type: boolean, enum: [true] }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [disabled, quotaBytes, usedBytes]
          properties:
            disabled: { type: boolean }
            quotaBytes: { $ref: '#/components/schemas/StorageBytes' }
            usedBytes: { $ref: '#/components/schemas/StorageBytes' }
    UpdateAdminUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/AccountRole' }
        disabled: { type: boolean }
        quotaBytes: { $ref: '#/components/schemas/StorageBytes' }
    AdminUserResponse:
      type: object
      required: [success, data]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data: { $ref: '#/components/schemas/AdminUser' }
    AdminUserListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PasswordResetIssuedResponse:
      type: object
      required: [success, data]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [token, expiresAt]
          properties:
            token: { $ref: '#/components/schemas/AccountLinkToken' }
            expiresAt: { type: string, format: date-time }
    AdminAuditEntry:
      type: object
      required: [id, actorId, actorEmail, action, targetId, targetEmail, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorEmail: { type: string, format: email }
        action: { type: string }
        targetId: { type: string, format: uuid, nullable: true }
        targetEmail: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }
    AdminAuditListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminAuditEntry' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    FolderReference:
      type: string
      pattern: '^(root|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$'
      description: A folder UUID or the literal root.
    FolderSummary:
      type: object
      required: [kind, id, name, parentId, description, createdAt, updatedAt]
      properties:
        kind:
          type: string
          enum: [folder]
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          $ref: '#/components/schemas/FolderDescription'
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Null for a folder directly under the user's root.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FolderName:
      type: string
      minLength: 1
      maxLength: 255
      description: >-
        Trimmed display name. Exact case-sensitive active sibling names must be
        unique for the same owner, including in the root.
    FolderDescription:
      type: string
      nullable: true
      maxLength: 2000
      description: Optional plain-text description shown to accounts authorized to read the folder.
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/FolderName'
        description:
          $ref: '#/components/schemas/FolderDescription'
        parentId:
          type: string
