    put:
      operationId: grantFolderShare
      tags: [Folders, Sharing]
      summary: Grant or update read and download access to a folder and its descendants
      description: >-
        The folder owner grants access to an existing account by email. A blank expiry
        on a new grant defaults to one calendar month in Vietnam time. A repeated request
        with a blank expiry preserves an active grant's expiration. An unknown recipient
        email returns 404 with code RECIPIENT_NOT_FOUND.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantFileShareRequest'
      responses:
        '200':
